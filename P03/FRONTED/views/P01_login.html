<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <link rel="stylesheet" href="Estilos.css">
    <script src="JavaScript.js"></script>

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body class=" d-flex justify-content-center align-items-center vh-100 bodyLogin">
    <header>
        <!-- place navbar here -->
    </header>
    <main>

        <div style="width: 300px;">
            <div class="card ">
                <div class="card-body tarjeta">
                    <form action="./P01_home.html" id="formLogin">
                        Correo
                        <br>
                        <input type="email" class="form-control" placeholder="ejemplo@correo.com" required>
                        <br>
                        Contraseña
                        <br>
                        <input type="password" class="form-control" placeholder="Password" required>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn_1">
                                Iniciar Sesion
                            </button>
                            <br>
                            <button type="button" class="btn btn-secondary btn_1" onclick="toggleForms()">
                                Registrarme
                            </button>
                            <br>
                        </div>
                    </form>
                    <form id="formRegister" action="javascript:alert('Registro Exitoso!')" style="display: none;">
                        Nombre
                        <br>
                        <input type="text" class="form-control" placeholder="Tu nombre" required>
                        <br>
                        Correo
                        <br>
                        <input type="email" class="form-control" placeholder="ejemplo@correo.com" required>
                        <br>
                        Contraseña
                        <br>
                        <input type="password" class="form-control" placeholder="Tu contraseña" required>
                        <br>
                        Confirma tu contraseña
                        <br>
                        <input type="password" class="form-control" placeholder="Escribe de nuevo tu contraseña"
                            required>
                        <br>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn_1">
                                Crear Cuenta
                            </button>
                            <br>
                            <button type="button" class="btn btn-secondary btn_1" onclick="toggleForms()">
                                Iniciar Sesion
                            </button>
                            <br>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
