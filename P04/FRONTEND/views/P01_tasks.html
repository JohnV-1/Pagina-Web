<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <title>Tasks</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../views/Estilos.css">

    <!-- env.js AL INICIO: valida la sesion antes de cargar la pagina -->
    <script src="../controllers/env.js"></script>
</head>

<body class="fondo">
    <header>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="home.html">
                    <img src="https://i.pinimg.com/736x/ac/13/74/ac137456b996efec340292a585eb6dc7.jpg" alt="Avatar Logo"
                        style="width:40px;" class="rounded-pill">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <a href="tasks.html"><span class="navbar-text">Tareas</span></a>
                    <div class="dropdown">
                        <button type="button" class="btn dropdown-toggle" data-bs-toggle="dropdown">
                            Etiquetas
                        </button>
                        <!-- Las etiquetas se agregan desde tags_controller.js -->
                        <ul class="dropdown-menu" id="dropdownList">
                            <li id="newTagItem">
                                <button type="button" class="dropdown-item" onclick="newTag()">
                                    <i class="fas fa-plus" style="font-size:14px"></i> Nueva etiqueta
                                </button>
                            </li>
                        </ul>
                    </div>
                    <form class="d-flex ms-auto">
                        <input type="search" class="form-control me-2" placeholder="Buscar">
                        <button type="button" class="btn btn-outline-success">Buscar</button>
                    </form>

                    <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#myModal"
                        title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt" style="font-size:24px;color:white;"></i>
                    </button>
                    <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#modalEdit"
                        title="Editar usuario">
                        <i class="fas fa-gear" style="font-size:24px;color:white;"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <!-- ===================== MODALES ===================== -->

        <!-- Modal cerrar sesion -->
        <div class="modal fade" id="myModal" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Cerrar Sesión</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ¿Está seguro de querer cerrar la sesión?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" onclick="logout()">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal crear / editar etiqueta (el mismo modal sirve para ambas) -->
        <div class="modal fade" id="modalEtiqueta" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <form id="formTag" action="">
                        <div class="modal-header">
                            <h4 class="modal-title" id="tagModalTitle">Nueva Etiqueta</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="tag_id" name="id">
                            <label for="tag_name" class="form-label">Nombre</label>
                            <input type="text" id="tag_name" name="name" class="form-control mb-3"
                                placeholder="Deporte" required>
                            <label for="tag_color" class="form-label">Color</label>
                            <input type="color" id="tag_color" name="color" class="form-control form-control-color w-100"
                                value="#0d6efd" required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger d-none me-auto" id="tagDeleteBtn">Eliminar</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="tagSubmitBtn">Crear Etiqueta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal editar usuario -->
        <div class="modal fade" id="modalEdit" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <form id="formEditUser" action="">
                        <div class="modal-header">
                            <h4 class="modal-title">Editar Usuario</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <label for="name_field" class="form-label">Nombre</label>
                            <input type="text" name="name" class="form-control mb-3" id="name_field" required>
                            <label for="email_field" class="form-label">Correo</label>
                            <input type="email" name="email" class="form-control mb-3" id="email_field" required>
                            <label for="password_field" class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" id="password_field"
                                minlength="8" required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                                data-bs-target="#modalDeleteUser">Eliminar</button>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal eliminar usuario -->
        <div class="modal fade" id="modalDeleteUser" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Eliminar Usuario</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ¿Seguro que desea eliminar su usuario?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnConfirmDeleteUser">Aceptar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal nueva tarea -->
        <div class="modal fade" id="modalTarea" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <form id="formNewTask" action="">
                        <div class="modal-header">
                            <h4 class="modal-title">Nueva Tarea</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <label for="new_task_title" class="form-label">Nombre</label>
                            <input type="text" id="new_task_title" name="title" class="form-control mb-3"
                                placeholder="Ej. Estudiar DAW" required>
                            <label for="new_task_date" class="form-label">Fecha</label>
                            <input type="date" id="new_task_date" name="due_date" class="form-control mb-3" required>
                            <label for="new_task_tag" class="form-label">Etiqueta</label>
                            <!-- Opciones llenadas desde tags_controller.js -->
                            <select id="new_task_tag" name="tag" class="form-select tag-select">
                                <option value="">Sin etiqueta</option>
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Crear Tarea</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal editar tarea -->
        <div class="modal fade" id="modalEditTask" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <form id="formEditTask" action="">
                        <div class="modal-header">
                            <h4 class="modal-title">Editar tarea</h4>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="edit_task_id" name="id">
                            <label for="edit_task_title" class="form-label">Nombre</label>
                            <input type="text" id="edit_task_title" name="title" class="form-control mb-3" required>
                            <label for="edit_task_date" class="form-label">Fecha</label>
                            <input type="date" id="edit_task_date" name="due_date" class="form-control mb-3" required>
                            <label for="edit_task_tag" class="form-label">Etiqueta</label>
                            <select id="edit_task_tag" name="tag" class="form-select tag-select">
                                <option value="">Sin etiqueta</option>
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal eliminar tarea -->
        <div class="modal fade" id="modalDeleteTask" tabindex="-1">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Eliminar Tarea</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ¿Seguro que desea eliminar la tarea "<b id="deleteTaskName"></b>"?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="btnConfirmDeleteTask">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===================== LISTA DE TAREAS ===================== -->
        <!-- Filtro por etiqueta (misma logica que el widget de home) -->
        <div id="tasksTagFilters" class="tag-filters-bar text-center"></div>

        <p id="tasksEmpty" class="text-center text-light fs-5 mt-4 d-none"></p>
        <div class="table-responsive">
            <table class="table table-primary table-striped table-hover d-none" id="tasksTable">
                <thead>
                    <tr>
                        <th scope="col"><i class="fa-solid fa-check"></i></th>
                        <th scope="col">Tarea</th>
                        <th scope="col">Etiqueta</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tasksTbody"></tbody>
            </table>
        </div>
        <ul class="pagination justify-content-center" id="tasksPagination"></ul>

        <button type="button" class="btn2" data-bs-toggle="modal" data-bs-target="#modalTarea" title="Nueva tarea">
            <i class="fas fa-plus" style="font-size:28px"></i>
        </button>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!--SCRIPTS (despues de Bootstrap porque usan bootstrap.Modal)-->
    <script src="../controllers/auth_controller.js"></script>
    <script src="../controllers/tasks_controller.js"></script>
    <script src="../controllers/tags_controller.js"></script>
</body>

</html>
